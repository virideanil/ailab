name: Kovan engine validation
on:
  push:
    paths:
      - "src/**"
      - "public/**"
      - "fixtures/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "Launch Kovan.command"
      - "docs/handoff-evidence.json"
      - "START-HERE.md"
      - "HANDOFF.md"
      - "docs/MAC-HANDOFF.md"
      - ".github/workflows/**"
permissions:
  contents: read
concurrency:
  group: kovan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit and adversarial tests
        run: npm test
      - name: Explicit fake end-to-end smoke
        run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-${{ matrix.os }}
          path: artifacts
          retention-days: 14
  browser:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Prepare explicit simulation evidence
        run: npm run test:smoke
      - name: Install isolated browser test dependency
        run: npm install --prefix .browser-tests --no-save playwright@1.64.0
      - name: Install Chromium
        run: node .browser-tests/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser, responsive, and screenshot checks
        run: node scripts/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-observatory
          path: artifacts
          retention-days: 30
  package:
    needs: [unit, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Create source handoff
        run: |
          git archive --format=tar.gz --prefix=kovan/ --output=kovan-source.tar.gz HEAD
          git archive --format=zip --prefix=kovan-mac/ --output=kovan-mac.zip HEAD
          sha256sum kovan-source.tar.gz kovan-mac.zip > SHA256SUMS
          git rev-parse HEAD > SOURCE-COMMIT.txt
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; writeFileSync("PACK-IDENTITY.json",JSON.stringify({sourceCommit:readFileSync("SOURCE-COMMIT.txt","utf8").trim(),target:"Apple M5 / 16 GB",modelWeightsIncluded:false,runtimeIncluded:false,tests:"See this commit Actions results"},null,2)+"\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: kovan-mac-pack
          path: |
            kovan-source.tar.gz
            kovan-mac.zip
            SHA256SUMS
            SOURCE-COMMIT.txt
            PACK-IDENTITY.json
          retention-days: 30
